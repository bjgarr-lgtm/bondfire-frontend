<!doctype html>
<html lang="en">
  <head>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8b1d1d" />

    <!-- iOS “Add to Home Screen” support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bondfire" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Better mobile sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Bondfire</title>

    <!-- Enable Matrix E2EE: loads window.Olm and olm.wasm from CDN -->
    <link rel="icon" type="image/png" href="/icons/favicon.png">

  </head>

  <body>
    <div id="root"></div>
    <script>
      // Inline editor guard.
      // The homepage normalizer trims list values on every React change, which makes
      // trailing spaces and blank "Add item" rows vanish while editing. Humanity survives.
      (function () {
        var originalTrim = String.prototype.trim;
        var preserveEditorSpacesUntil = 0;
        var forceEmptyListItemUntil = 0;

        function now() {
          return Date.now ? Date.now() : new Date().getTime();
        }

        function editorActive() {
          var el = document.activeElement;
          return !!(el && el.closest && el.closest('.rh-inline-editor, .rh-editor-toolbar input, .rh-editor-toolbar select, .rh-editor-toolbar textarea'));
        }

        String.prototype.trim = function () {
          var raw = String(this);
          var t = now();

          if (t < forceEmptyListItemUntil && raw === '') {
            return 'New item';
          }

          if (t < preserveEditorSpacesUntil) {
            return raw;
          }

          return originalTrim.call(this);
        };

        function isEditorTextField(target) {
          if (!target || !target.closest) return false;
          if (!target.closest('.rh-inline-editor, .rh-editor-toolbar input, .rh-editor-toolbar select, .rh-editor-toolbar textarea')) return false;
          var tag = String(target.tagName || '').toLowerCase();
          return tag === 'input' || tag === 'textarea';
        }

        function setNativeValue(target, value) {
          var tag = String(target.tagName || '').toLowerCase();
          var proto = tag === 'textarea' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
          var descriptor = Object.getOwnPropertyDescriptor(proto, 'value');
          if (descriptor && descriptor.set) {
            descriptor.set.call(target, value);
          } else {
            target.value = value;
          }
        }

        function insertText(target, text) {
          var start = typeof target.selectionStart === 'number' ? target.selectionStart : String(target.value || '').length;
          var end = typeof target.selectionEnd === 'number' ? target.selectionEnd : start;
          var value = String(target.value || '');
          var next = value.slice(0, start) + text + value.slice(end);

          preserveEditorSpacesUntil = now() + 2000;
          setNativeValue(target, next);
          try {
            target.setSelectionRange(start + text.length, start + text.length);
          } catch (e) {}

          target.dispatchEvent(new Event('input', { bubbles: true }));
        }

        window.addEventListener('keydown', function (event) {
          var target = event.target;
          var isSpace = event.key === ' ' || event.key === 'Spacebar' || event.code === 'Space';

          if (isSpace && isEditorTextField(target) && !target.readOnly && !target.disabled) {
            event.preventDefault();
            event.stopImmediatePropagation();
            insertText(target, ' ');
            return;
          }

          if (isEditorTextField(target)) {
            preserveEditorSpacesUntil = now() + 2000;
          }
        }, true);

        window.addEventListener('input', function (event) {
          if (isEditorTextField(event.target)) {
            preserveEditorSpacesUntil = now() + 2000;
          }
        }, true);

        window.addEventListener('click', function (event) {
          var target = event.target;
          if (!target || !target.closest) return;
          var button = target.closest('button');
          if (!button) return;
          if (originalTrim.call(String(button.textContent || '')) !== 'Add item') return;
          if (!button.closest('.rh-inline-group')) return;
          forceEmptyListItemUntil = now() + 2000;
          preserveEditorSpacesUntil = now() + 2000;
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
