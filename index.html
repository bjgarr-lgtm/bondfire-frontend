<!doctype html>
<html lang="en">
  <head>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8b1d1d" />

    <!-- iOS “Add to Home Screen” support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bondfire" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Better mobile sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Bondfire</title>

    <!-- Enable Matrix E2EE: loads window.Olm and olm.wasm from CDN -->
    <link rel="icon" type="image/png" href="/icons/favicon.png">

  </head>

  <body>
    <div id="root"></div>
    <script>
      // Red Harbor public-page editor stability patch.
      // This keeps editor fields usable even if app-level handlers or save verification get dumb.
      (function () {
        var lastSavedPublic = null;
        var lastSavedAt = 0;
        var originalFetch = window.fetch.bind(window);

        function now() {
          return Date.now ? Date.now() : new Date().getTime();
        }

        function requestUrl(input) {
          try {
            if (typeof input === 'string') return input;
            if (input && input.url) return String(input.url);
          } catch (e) {}
          return '';
        }

        window.fetch = async function (input, init) {
          var url = requestUrl(input);
          var method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();

          if (method === 'GET' && url.indexOf('/api/public-home/red-harbor') !== -1 && lastSavedPublic && now() - lastSavedAt < 15000) {
            return new Response(JSON.stringify({ ok: true, orgId: 'red-harbor', public: lastSavedPublic }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          var res = await originalFetch(input, init);

          if (method === 'POST' && url.indexOf('/api/orgs/red-harbor/public/save') !== -1) {
            try {
              var cloned = res.clone();
              cloned.json().then(function (data) {
                if (data && data.ok !== false && data.public) {
                  lastSavedPublic = data.public;
                  lastSavedAt = now();
                }
              }).catch(function () {});
            } catch (e) {}
          }

          return res;
        };

        function isEditorTextField(target) {
          if (!target || !target.closest) return false;
          if (!target.closest('.rh-editor-mode')) return false;
          if (!target.closest('.rh-inline-editor, .rh-editor-toolbar input, .rh-editor-toolbar textarea')) return false;
          var tag = String(target.tagName || '').toLowerCase();
          return tag === 'input' || tag === 'textarea';
        }

        function setNativeValue(target, value) {
          var tag = String(target.tagName || '').toLowerCase();
          var proto = tag === 'textarea' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
          var descriptor = Object.getOwnPropertyDescriptor(proto, 'value');
          if (descriptor && descriptor.set) {
            descriptor.set.call(target, value);
          } else {
            target.value = value;
          }
        }

        function insertText(target, text) {
          var value = String(target.value || '');
          var start = typeof target.selectionStart === 'number' ? target.selectionStart : value.length;
          var end = typeof target.selectionEnd === 'number' ? target.selectionEnd : start;
          var next = value.slice(0, start) + text + value.slice(end);

          setNativeValue(target, next);
          try { target.setSelectionRange(start + text.length, start + text.length); } catch (e) {}
          target.dispatchEvent(new Event('input', { bubbles: true }));
        }

        window.addEventListener('keydown', function (event) {
          var target = event.target;
          var isSpace = event.key === ' ' || event.key === 'Spacebar' || event.code === 'Space';

          if (isSpace && isEditorTextField(target) && !target.readOnly && !target.disabled) {
            event.preventDefault();
            event.stopImmediatePropagation();
            insertText(target, ' ');
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
