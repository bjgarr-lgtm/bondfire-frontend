<!doctype html>
<html lang="en">
  <head>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8b1d1d" />

    <!-- iOS “Add to Home Screen” support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bondfire" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Better mobile sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Bondfire</title>

    <!-- Enable Matrix E2EE: loads window.Olm and olm.wasm from CDN -->
    <link rel="icon" type="image/png" href="/icons/favicon.png">

  </head>

  <body>
    <div id="root"></div>
    <script>
      // Keep global keyboard handlers from eating normal typing inside inline editors.
      // Space is inserted manually because some app/page listener is swallowing it later.
      window.addEventListener('keydown', function (event) {
        var target = event.target;
        if (!target || !target.closest) return;
        if (!target.closest('.rh-inline-editor, .rh-editor-toolbar input, .rh-editor-toolbar select, .rh-editor-toolbar textarea')) return;

        var tag = String(target.tagName || '').toLowerCase();
        var isTextField = tag === 'input' || tag === 'textarea';
        var isSpace = event.key === ' ' || event.key === 'Spacebar' || event.code === 'Space';

        if (isSpace && isTextField && !target.readOnly && !target.disabled) {
          event.preventDefault();
          event.stopImmediatePropagation();

          var start = typeof target.selectionStart === 'number' ? target.selectionStart : String(target.value || '').length;
          var end = typeof target.selectionEnd === 'number' ? target.selectionEnd : start;
          var value = String(target.value || '');
          var next = value.slice(0, start) + ' ' + value.slice(end);

          target.value = next;
          try {
            target.setSelectionRange(start + 1, start + 1);
          } catch (e) {}

          target.dispatchEvent(new InputEvent('input', {
            inputType: 'insertText',
            data: ' ',
            bubbles: true,
            cancelable: true,
          }));
          return;
        }

        if (
          event.key === 'Enter' ||
          event.key === 'Backspace' ||
          event.key === 'Delete' ||
          event.key === 'ArrowLeft' ||
          event.key === 'ArrowRight' ||
          event.key === 'ArrowUp' ||
          event.key === 'ArrowDown'
        ) {
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
